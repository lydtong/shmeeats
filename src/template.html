<title>shmeeats</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap">
<style>
/* layout: one quiet column; the map is the only wide thing. */
:root {
  --bg: #f1f6f0;
  --surface: #ffffff;
  --surface-2: #e7f0e7;
  --ink: #1c3b2c;
  --ink-soft: #5c7a69;
  --line: #d2e2d5;
  --accent: #37895a;
  --accent-ink: #ffffff;
  --accent-soft: #dcefe1;
  --map-fill: #dbe9dd;
  --map-line: #ffffff;
  --pin: #2f7b4f;
  --pin-ring: #ffffff;
  --danger: #b4513f;
  --font: "Nunito", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --radius: 14px;
  --shadow: 0 10px 30px rgba(28, 59, 44, 0.08);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1b15; --surface: #172620; --surface-2: #1d3128; --ink: #e5efe7; --ink-soft: #9bb8a6;
    --line: #2b4234; --accent: #7fcf9a; --accent-ink: #0f1b15; --accent-soft: #1f3a2b;
    --map-fill: #233a2e; --map-line: #0f1b15; --pin: #8fd9a6; --pin-ring: #0f1b15; --danger: #e08b7a;
    --shadow: 0 10px 30px rgba(0, 0, 0, 0.35); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1b15; --surface: #172620; --surface-2: #1d3128; --ink: #e5efe7; --ink-soft: #9bb8a6;
  --line: #2b4234; --accent: #7fcf9a; --accent-ink: #0f1b15; --accent-soft: #1f3a2b;
  --map-fill: #233a2e; --map-line: #0f1b15; --pin: #8fd9a6; --pin-ring: #0f1b15; --danger: #e08b7a;
  --shadow: 0 10px 30px rgba(0, 0, 0, 0.35); color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 16px; line-height: 1.5;
  display: flex; flex-direction: column; min-height: 100%;
}
a { color: inherit; }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
.wrap {
  width: 100%; max-width: 1040px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.logo {
  display: inline-block; aspect-ratio: 920 / 560; max-width: 100%;
  background: var(--ink);
  -webkit-mask: url("__LOGO__") center / contain no-repeat;
  mask: url("__LOGO__") center / contain no-repeat;
}

/* nav */
.nav { padding-block: 14px 10px; }
.nav .wrap { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
.brand { display: flex; align-items: center; gap: 10px; text-decoration: none; font-weight: 600; letter-spacing: -0.01em; font-size: 1.15rem; }
.brand .logo { width: 54px; }
.links { display: flex; gap: 6px; }
.links a { text-decoration: none; padding: 6px 12px; border-radius: 999px; font-weight: 600; color: var(--ink-soft); }
.links a[aria-current="page"] { background: var(--accent-soft); color: var(--ink); }
.links a:hover { color: var(--ink); }

main { flex: 1; }
footer { padding-block: 28px 24px; color: var(--ink-soft); font-size: 0.85rem; }
footer .wrap { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
footer a { color: var(--ink-soft); }

/* home */
.home { text-align: center; padding-block: clamp(32px, 9vh, 96px) 40px; display: flex; flex-direction: column; align-items: center; gap: 12px; }
.home .logo { width: min(420px, 82vw); }
.wordmark { font-size: clamp(2.4rem, 8vw, 4.2rem); font-weight: 500; letter-spacing: -0.02em; margin: 0; line-height: 1; }
.tagline { margin: 0; color: var(--ink-soft); font-weight: 600; }
.cta { margin-top: 14px; display: inline-flex; align-items: center; gap: 8px; background: var(--accent); color: var(--accent-ink); text-decoration: none; padding: 11px 20px; border-radius: 999px; font-weight: 600; }
.cta:hover { filter: brightness(1.06); }

/* food */
.section-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-block: 8px 12px; }
.section-head h1 { margin: 0; font-size: 1.6rem; font-weight: 600; letter-spacing: -0.01em; }
.section-head .count { color: var(--ink-soft); font-weight: 500; }
.food-grid { display: grid; grid-template-columns: minmax(0, 1.7fr) minmax(280px, 1fr); gap: 18px; align-items: start; }
@media (max-width: 760px) { .food-grid { grid-template-columns: minmax(0, 1fr); } }
.map-card { background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow); padding: 10px; min-width: 0; }
.map-card svg { width: 100%; height: auto; display: block; }
.state { fill: var(--map-fill); stroke: var(--map-line); stroke-width: 1; }
.pin { cursor: pointer; }
.pin circle { fill: var(--pin); stroke: var(--pin-ring); stroke-width: 2.5; transition: r 0.15s ease; }
.pin:hover circle, .pin.selected circle { r: 10; }
.pin.selected .halo { fill: none; stroke: var(--pin); stroke-width: 2; opacity: 0.5; }
.pin .halo { fill: none; stroke: none; }
.pin.preview circle { fill: var(--accent); }
.map-note { color: var(--ink-soft); font-size: 0.85rem; text-align: center; margin: 6px 0 2px; }
.detail { background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow); padding: 18px; min-width: 0; }
.detail.empty { color: var(--ink-soft); text-align: center; padding-block: 38px; }
.detail h2 { margin: 0 0 2px; font-size: 1.35rem; font-weight: 600; letter-spacing: -0.01em; text-wrap: balance; }
.detail .where { color: var(--ink-soft); font-weight: 500; margin: 0 0 10px; }
.detail .ate { margin: 0 0 10px; font-weight: 600; }
.ratings { display: flex; flex-direction: column; gap: 4px; margin-bottom: 10px; }
.rating-row { display: flex; align-items: center; gap: 8px; }
.rating-row .who { width: 46px; font-weight: 600; color: var(--ink-soft); font-size: 0.9rem; }
.stars { letter-spacing: 1px; color: var(--accent); font-size: 1.05rem; }
.stars .off { opacity: 0.25; }
.notes { white-space: pre-wrap; margin: 0 0 12px; }
.photos { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 8px; }
.photos button { padding: 0; border: 0; background: var(--surface-2); border-radius: 10px; overflow: hidden; aspect-ratio: 1; }
.photos img { width: 100%; height: 100%; object-fit: cover; display: block; }
.meta { color: var(--ink-soft); font-size: 0.85rem; margin-top: 12px; }
.list { margin-top: 22px; }
.list h2 { font-size: 1.1rem; font-weight: 600; margin: 0 0 10px; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 10px; }
.card { text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; display: flex; flex-direction: column; gap: 2px; }
.card:hover, .card.selected { border-color: var(--accent); }
.card .name { font-weight: 600; }
.card .sub { color: var(--ink-soft); font-size: 0.88rem; }
.empty-state { color: var(--ink-soft); text-align: center; padding-block: 40px; }

/* lightbox */
.lightbox { position: fixed; inset: 0; background: rgba(10, 25, 17, 0.9); display: flex; align-items: center; justify-content: center; padding: 20px; z-index: 50; border: 0; }
.lightbox img { max-width: 100%; max-height: 100%; border-radius: 10px; }

/* admin */
.admin-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
.admin-top .who { color: var(--ink-soft); font-weight: 500; }
.login { max-width: 360px; margin: 30px auto; background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow); padding: 24px; display: flex; flex-direction: column; gap: 12px; }
.login h1 { margin: 0; font-size: 1.3rem; font-weight: 600; }
.admin-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 18px; align-items: start; }
@media (max-width: 820px) { .admin-grid { grid-template-columns: minmax(0, 1fr); } }
.panel { background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow); padding: 18px; min-width: 0; }
.panel h2 { margin: 0 0 12px; font-size: 1.15rem; font-weight: 600; }
.field { display: flex; flex-direction: column; gap: 4px; margin-bottom: 12px; }
.field label { font-weight: 600; font-size: 0.85rem; color: var(--ink-soft); text-transform: uppercase; letter-spacing: 0.06em; }
.field .hint { font-size: 0.8rem; color: var(--ink-soft); }
input[type="text"], input[type="password"], input[type="date"], textarea, select {
  width: 100%; border: 1px solid var(--line); background: var(--bg); border-radius: 10px; padding: 9px 12px;
}
textarea { min-height: 90px; resize: vertical; }
.row { display: flex; gap: 10px; flex-wrap: wrap; }
.row > * { flex: 1 1 140px; min-width: 0; }
.btn { border: 0; background: var(--accent); color: var(--accent-ink); padding: 10px 18px; border-radius: 999px; font-weight: 600; }
.btn:disabled { opacity: 0.5; cursor: default; }
.btn.ghost { background: var(--accent-soft); color: var(--ink); }
.btn.small { padding: 5px 12px; font-size: 0.85rem; }
.btn.danger { background: transparent; color: var(--danger); border: 1px solid var(--line); }
.status { font-size: 0.9rem; color: var(--ink-soft); min-height: 1.4em; }
.status.err { color: var(--danger); }
.autocomplete { position: relative; }
.ac-list { position: absolute; left: 0; right: 0; top: 100%; z-index: 20; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow); overflow: hidden; margin-top: 4px; }
.ac-list button { display: block; width: 100%; text-align: left; border: 0; background: none; padding: 8px 12px; }
.ac-list button:hover, .ac-list button.active { background: var(--accent-soft); }
.ac-list .st { color: var(--ink-soft); }
.star-input { display: flex; gap: 2px; }
.star-input button { border: 0; background: none; padding: 0 2px; font-size: 1.5rem; line-height: 1; color: var(--accent); opacity: 0.25; }
.star-input button.on { opacity: 1; }
.star-input button:hover { opacity: 0.7; }
.photo-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(88px, 1fr)); gap: 8px; margin-top: 8px; }
.photo-grid .ph { position: relative; aspect-ratio: 1; border-radius: 10px; overflow: hidden; background: var(--surface-2); }
.photo-grid img { width: 100%; height: 100%; object-fit: cover; display: block; }
.photo-grid .x { position: absolute; top: 4px; right: 4px; border: 0; background: var(--surface); color: var(--danger); border-radius: 999px; width: 24px; height: 24px; font-weight: 900; line-height: 1; }
.admin-list { display: flex; flex-direction: column; gap: 8px; }
.admin-item { display: flex; align-items: center; justify-content: space-between; gap: 10px; border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; flex-wrap: wrap; }
.admin-item .n { font-weight: 600; }
.admin-item .s { color: var(--ink-soft); font-size: 0.86rem; }
.admin-item .acts { display: flex; gap: 6px; flex-wrap: wrap; }
.mini-map svg { width: 100%; height: auto; display: block; border-radius: 10px; background: var(--bg); cursor: crosshair; }
.toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 10px 18px; border-radius: 999px; font-weight: 600; z-index: 60; box-shadow: var(--shadow); }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<header class="nav">
  <div class="wrap">
    <a class="brand" href="#home" data-view="home"><span class="logo" aria-hidden="true"></span><span>shmeeats</span></a>
    <nav class="links" aria-label="pages">
      <a href="#home" data-view="home">home</a>
      <a href="#food" data-view="food">reviews</a>
    </nav>
  </div>
</header>

<main>
  <section id="view-home" class="wrap">
    <div class="home">
      <div class="logo" role="img" aria-label="two cats, drawn by hand"></div>
      <h1 class="wordmark">shmeeats</h1>
      <a class="cta" href="#food" data-view="food">reviews</a>
    </div>
  </section>

  <section id="view-food" class="wrap" hidden>
    <div class="section-head">
      <h1>reviews</h1>
      <span class="count" id="food-count"></span>
    </div>
    <div class="food-grid">
      <div class="map-card">
        <div id="food-map"></div>
        <p class="map-note">tap a pin to see what we thought</p>
      </div>
      <div id="food-detail" class="detail empty">pick a pin on the map</div>
    </div>
    <div class="list">
      <h2>every place so far</h2>
      <div id="food-cards" class="cards"></div>
    </div>
  </section>

  <section id="view-admin" class="wrap" hidden>
    <form id="login" class="login" hidden>
      <h1>admin</h1>
      <div class="field">
        <label for="login-user">who are you</label>
        <select id="login-user">
          <option value="mimi">mimi</option>
          <option value="lydia">lydia</option>
        </select>
      </div>
      <div class="field">
        <label for="login-pass">password</label>
        <input id="login-pass" type="password" autocomplete="current-password" required>
      </div>
      <button class="btn" type="submit">log in</button>
      <div id="login-status" class="status"></div>
    </form>

    <div id="admin" hidden>
      <div class="admin-top">
        <div class="section-head" style="margin:0"><h1>log a place</h1></div>
        <div class="who">logged in as <strong id="admin-who"></strong> · <a href="#admin" id="logout">log out</a></div>
      </div>
      <div class="admin-grid">
        <form id="review-form" class="panel" autocomplete="off">
          <h2 id="form-title">new review</h2>
          <input type="hidden" id="f-id">
          <input type="hidden" id="f-lat">
          <input type="hidden" id="f-lng">
          <div class="field">
            <label for="f-name">restaurant</label>
            <input id="f-name" type="text" placeholder="joe's pizza" required>
          </div>
          <div class="field autocomplete">
            <label for="f-city">where</label>
            <input id="f-city" type="text" placeholder="start typing a city…">
            <div id="ac" class="ac-list" hidden></div>
            <span class="hint" id="loc-hint">pick a city, tap the map, or paste "lat, lng"</span>
          </div>
          <div class="mini-map" id="admin-map"></div>
          <div class="field" style="margin-top:12px">
            <label for="f-ate">what we ate</label>
            <input id="f-ate" type="text" placeholder="the garlic knots, obviously">
          </div>
          <div class="field">
            <label>mimi's rating</label>
            <div class="star-input" id="stars-mimi" data-value="0"></div>
          </div>
          <div class="field">
            <label for="f-notes">notes</label>
            <textarea id="f-notes" placeholder="would we go back?"></textarea>
          </div>
          <div class="row">
            <div class="field">
              <label for="f-date">when</label>
              <input id="f-date" type="date">
            </div>
          </div>
          <div class="field" id="photo-field">
            <label for="f-photos">photos</label>
            <input id="f-photos" type="file" accept="image/*" multiple>
            <span class="hint" id="photo-hint"></span>
            <div id="photo-grid" class="photo-grid"></div>
          </div>
          <div class="row" style="align-items:center">
            <button class="btn" type="submit" id="save-btn">save</button>
            <button class="btn ghost" type="button" id="cancel-edit" hidden>cancel edit</button>
          </div>
          <div id="save-status" class="status"></div>
        </form>
        <div class="panel">
          <h2>already logged</h2>
          <div id="admin-list" class="admin-list"></div>
        </div>
      </div>
    </div>
  </section>
</main>

<footer>
  <div class="wrap">
    <span>made with love and a lot of snacks</span>
    <a href="#admin" data-view="admin">admin</a>
  </div>
</footer>

<script id="shmee-data" type="application/json">{"reviews":[]}</script>
<script id="shmee-states" type="application/json">__STATES__</script>
<script id="shmee-cities" type="application/json">__CITIES__</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<script>
(function () {
  'use strict';
  const $ = (s, el) => (el || document).querySelector(s);
  const USERS = ['mimi', 'lydia'];
  const PASSWORD = 'midia';
  const SVGNS = 'http://www.w3.org/2000/svg';

  // ---------- data ----------
  const DATA = JSON.parse($('#shmee-data').textContent || '{"reviews":[]}');
  DATA.reviews = Array.isArray(DATA.reviews) ? DATA.reviews : [];
  const STATES = JSON.parse($('#shmee-states').textContent);
  const CITIES = JSON.parse($('#shmee-cities').textContent);
  const proj = (window.d3 && d3.geoAlbersUsa) ? d3.geoAlbersUsa().scale(1300).translate([487.5, 305]) : null;

  const lsGet = (k) => { try { return localStorage.getItem(k); } catch (e) { return null; } };
  const lsSet = (k, v) => { try { v === null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch (e) {} };
  const ssGet = (k) => { try { return sessionStorage.getItem(k); } catch (e) { return null; } };
  const ssSet = (k, v) => { try { v === null ? sessionStorage.removeItem(k) : sessionStorage.setItem(k, v); } catch (e) {} };

  function toast(msg) {
    const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg;
    document.body.appendChild(t); setTimeout(() => t.remove(), 2600);
  }
  function stars(n) {
    const v = Math.max(0, Math.min(5, Number(n) || 0));
    let s = '';
    for (let i = 1; i <= 5; i++) s += i <= v ? '<span>★</span>' : '<span class="off">★</span>';
    return '<span class="stars" aria-label="' + v + ' out of 5">' + s + '</span>';
  }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
  function fmtDate(d) {
    if (!d) return '';
    const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(d); if (!m) return d;
    return new Date(Number(m[1]), Number(m[2]) - 1, Number(m[3])).toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' });
  }
  function blobUrl(id) { return '/_blob/' + id; }
  function sortedReviews() {
    return DATA.reviews.slice().sort((a, b) => (b.date || '').localeCompare(a.date || '') || (b.created || 0) - (a.created || 0));
  }

  // ---------- routing ----------
  const views = ['home', 'food', 'admin'];
  let current = 'home';
  function show(view) {
    if (!views.includes(view)) view = 'home';
    current = view;
    views.forEach((v) => { $('#view-' + v).hidden = v !== view; });
    document.querySelectorAll('.links a').forEach((a) => {
      if (a.dataset.view === view) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current');
    });
    if (view === 'food') renderFood();
    if (view === 'admin') renderAdmin();
    window.scrollTo({ top: 0 });
  }
  document.addEventListener('click', (e) => {
    const a = e.target.closest('a[data-view]');
    if (!a) return;
    e.preventDefault();
    try { location.hash = a.dataset.view; } catch (err) {}
    show(a.dataset.view);
  });
  window.addEventListener('hashchange', () => show((location.hash || '#home').slice(1)));

  // ---------- map ----------
  function buildMap(container, opts) {
    container.innerHTML = '';
    const svg = document.createElementNS(SVGNS, 'svg');
    svg.setAttribute('viewBox', '0 0 975 610');
    svg.setAttribute('role', 'img');
    svg.setAttribute('aria-label', 'map of the united states');
    const g = document.createElementNS(SVGNS, 'g');
    STATES.forEach((s) => {
      const p = document.createElementNS(SVGNS, 'path');
      p.setAttribute('d', s.d); p.setAttribute('class', 'state');
      const t = document.createElementNS(SVGNS, 'title'); t.textContent = s.n; p.appendChild(t);
      g.appendChild(p);
    });
    svg.appendChild(g);
    const pins = document.createElementNS(SVGNS, 'g');
    pins.setAttribute('class', 'pins');
    svg.appendChild(pins);
    container.appendChild(svg);
    if (opts && opts.onClick) {
      svg.addEventListener('click', (e) => {
        if (e.target.closest('.pin')) return;
        const pt = new DOMPoint(e.clientX, e.clientY).matrixTransform(svg.getScreenCTM().inverse());
        opts.onClick(pt.x, pt.y);
      });
    }
    return { svg, pins };
  }
  function placePins(map, items, opts) {
    map.pins.innerHTML = '';
    if (!proj) return;
    // spread pins that land on the same spot
    const groups = {};
    const placed = [];
    items.forEach((r) => {
      const xy = proj([Number(r.lng), Number(r.lat)]);
      if (!xy) return;
      const key = Math.round(xy[0] / 8) + ':' + Math.round(xy[1] / 8);
      groups[key] = (groups[key] || 0) + 1;
      placed.push({ r, xy, key, i: groups[key] - 1 });
    });
    placed.forEach(({ r, xy, key, i }) => {
      let [x, y] = xy;
      const n = groups[key];
      if (n > 1) { const a = (i / n) * Math.PI * 2; x += Math.cos(a) * 9; y += Math.sin(a) * 9; }
      const gp = document.createElementNS(SVGNS, 'g');
      gp.setAttribute('class', 'pin' + (opts && opts.selectedId === r.id ? ' selected' : '') + (opts && opts.preview ? ' preview' : ''));
      gp.setAttribute('transform', 'translate(' + x.toFixed(1) + ',' + y.toFixed(1) + ')');
      gp.setAttribute('tabindex', '0'); gp.setAttribute('role', 'button');
      const halo = document.createElementNS(SVGNS, 'circle'); halo.setAttribute('class', 'halo'); halo.setAttribute('r', '16');
      const c = document.createElementNS(SVGNS, 'circle'); c.setAttribute('r', '7');
      const t = document.createElementNS(SVGNS, 'title'); t.textContent = r.name || 'here';
      gp.appendChild(halo); gp.appendChild(c); gp.appendChild(t);
      if (opts && opts.onSelect) {
        gp.addEventListener('click', (e) => { e.stopPropagation(); opts.onSelect(r); });
        gp.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); opts.onSelect(r); } });
      }
      map.pins.appendChild(gp);
    });
  }

  // ---------- food page ----------
  let foodMap = null, selectedId = null;
  function renderFood() {
    const list = sortedReviews();
    const states = new Set();
    list.forEach((r) => { if (r.state) states.add(r.state); });
    $('#food-count').textContent = list.length
      ? list.length + (list.length === 1 ? ' place' : ' places') + (states.size ? ' · ' + states.size + (states.size === 1 ? ' state' : ' states') : '')
      : '';
    if (!foodMap) foodMap = buildMap($('#food-map'));
    placePins(foodMap, list, { selectedId, onSelect: (r) => selectReview(r.id) });
    const cards = $('#food-cards');
    if (!list.length) {
      cards.innerHTML = '';
      $('#food-detail').className = 'detail empty';
      $('#food-detail').textContent = 'nothing logged yet. the cats are hungry.';
      return;
    }
    cards.innerHTML = list.map((r) => {
      const avg = avgRating(r);
      return '<button class="card' + (r.id === selectedId ? ' selected' : '') + '" data-id="' + esc(r.id) + '">' +
        '<span class="name">' + esc(r.name) + '</span>' +
        '<span class="sub">' + esc(r.place || '') + (r.date ? ' · ' + esc(fmtDate(r.date)) : '') + '</span>' +
        (avg ? stars(Math.round(avg)) : '') + '</button>';
    }).join('');
    cards.querySelectorAll('.card').forEach((b) => b.addEventListener('click', () => selectReview(b.dataset.id)));
    renderDetail();
  }
  function avgRating(r) { return Number(r.ratingMimi) || 0; }
  function selectReview(id) {
    selectedId = id;
    renderFood();
    const d = $('#food-detail');
    if (window.innerWidth < 760) d.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }
  function renderDetail() {
    const d = $('#food-detail');
    const r = DATA.reviews.find((x) => x.id === selectedId);
    if (!r) { d.className = 'detail empty'; d.textContent = 'pick a pin on the map'; return; }
    d.className = 'detail';
    let html = '<h2>' + esc(r.name) + '</h2>' +
      '<p class="where">' + esc(r.place || '') + '</p>' +
      (r.ate ? '<p class="ate">we ate: ' + esc(r.ate) + '</p>' : '') +
      '<div class="ratings">' +
      (Number(r.ratingMimi) > 0 ? '<div class="rating-row"><span class="who">mimi</span>' + stars(r.ratingMimi) + '</div>' : '') +
      '</div>' +
      (r.notes ? '<p class="notes">' + esc(r.notes) + '</p>' : '');
    const photos = Array.isArray(r.photos) ? r.photos : [];
    if (photos.length) {
      html += '<div class="photos">' + photos.map((id) => '<button type="button" data-photo="' + esc(id) + '" aria-label="open photo"><img src="' + esc(blobUrl(id)) + '" alt="" loading="lazy"></button>').join('') + '</div>';
    }
    html += '<div class="meta">' + (r.date ? esc(fmtDate(r.date)) : '') + (r.by ? ' · logged by ' + esc(r.by) : '') + '</div>';
    d.innerHTML = html;
    d.querySelectorAll('[data-photo]').forEach((b) => b.addEventListener('click', () => openLightbox(blobUrl(b.dataset.photo))));
  }
  function openLightbox(src) {
    const lb = document.createElement('button'); lb.className = 'lightbox'; lb.setAttribute('aria-label', 'close photo');
    const img = document.createElement('img'); img.src = src; img.alt = '';
    lb.appendChild(img); lb.addEventListener('click', () => lb.remove());
    document.body.appendChild(lb);
  }

  // ---------- admin ----------
  let admin = lsGet('shmee_admin');
  if (!USERS.includes(admin)) admin = null;
  let adminMap = null, editingId = null;
  let photoIds = [];   // already-uploaded asset ids (editing)
  let pendingFiles = []; // {file, url} not yet uploaded
  let assetsNS = undefined, artifactNS = undefined;

  function renderAdmin() {
    $('#login').hidden = !!admin;
    $('#admin').hidden = !admin;
    if (!admin) { $('#login-pass').value = ''; return; }
    $('#admin-who').textContent = admin;
    if (!adminMap) {
      adminMap = buildMap($('#admin-map'), { onClick: (x, y) => {
        if (!proj || !proj.invert) return;
        const ll = proj.invert([x, y]);
        if (!ll) return;
        setLocation(ll[1], ll[0], nearestCityLabel(ll[1], ll[0]));
      } });
    }
    if (!$('#f-date').value && !editingId) $('#f-date').value = new Date().toISOString().slice(0, 10);
    updatePreviewPin();
    renderAdminList();
    resolveCaps();
  }
  async function resolveCaps() {
    if (assetsNS !== undefined) return;
    assetsNS = null; artifactNS = null;
    if (!window.claude || !window.claude.use) { $('#photo-hint').textContent = 'photos save only on the published site.'; return; }
    try { [assetsNS, artifactNS] = await Promise.all([claude.use('assets'), claude.use('artifact')]); } catch (e) { assetsNS = null; artifactNS = null; }
    if (!assetsNS) {
      $('#f-photos').disabled = true;
      $('#photo-hint').textContent = 'photo uploads need editor access on this page. ask lydia to add you as an editor.';
    } else {
      $('#photo-hint').textContent = 'phone photos get shrunk before upload.';
    }
  }

  $('#login').addEventListener('submit', (e) => {
    e.preventDefault();
    const u = $('#login-user').value, p = $('#login-pass').value;
    if (USERS.includes(u) && p === PASSWORD) {
      admin = u; lsSet('shmee_admin', u); $('#login-status').textContent = ''; renderAdmin();
    } else {
      $('#login-status').textContent = 'that password is not it.'; $('#login-status').className = 'status err';
    }
  });
  $('#logout').addEventListener('click', (e) => { e.preventDefault(); admin = null; lsSet('shmee_admin', null); renderAdmin(); });

  // star inputs
  ['mimi'].forEach((who) => {
    const el = $('#stars-' + who);
    for (let i = 1; i <= 5; i++) {
      const b = document.createElement('button'); b.type = 'button'; b.textContent = '★'; b.setAttribute('aria-label', i + ' stars');
      b.addEventListener('click', () => setStars(who, Number(el.dataset.value) === i ? 0 : i));
      el.appendChild(b);
    }
  });
  function setStars(who, v) {
    const el = $('#stars-' + who); el.dataset.value = v;
    el.querySelectorAll('button').forEach((b, i) => b.classList.toggle('on', i < v));
  }

  // location
  function setLocation(lat, lng, label) {
    $('#f-lat').value = lat.toFixed(4); $('#f-lng').value = lng.toFixed(4);
    if (label != null) $('#f-city').value = label;
    $('#loc-hint').textContent = 'pinned at ' + lat.toFixed(3) + ', ' + lng.toFixed(3);
    updatePreviewPin();
  }
  function nearestCityLabel(lat, lng) {
    let best = null, bd = Infinity;
    for (const c of CITIES) {
      const d = (c[2] - lat) * (c[2] - lat) + (c[3] - lng) * (c[3] - lng);
      if (d < bd) { bd = d; best = c; }
    }
    return best && bd < 1 ? 'near ' + best[0] + ', ' + best[1] : '';
  }
  function updatePreviewPin() {
    if (!adminMap) return;
    const lat = Number($('#f-lat').value), lng = Number($('#f-lng').value);
    placePins(adminMap, lat && lng ? [{ id: 'preview', name: $('#f-name').value || 'here', lat, lng }] : [], { preview: true });
  }
  const cityInput = $('#f-city'), ac = $('#ac');
  let acItems = [], acIndex = -1;
  cityInput.addEventListener('input', () => {
    const q = cityInput.value.trim();
    const m = /^\s*(-?\d+(?:\.\d+)?)\s*,\s*(-?\d+(?:\.\d+)?)\s*$/.exec(q);
    if (m) { setLocation(Number(m[1]), Number(m[2]), null); ac.hidden = true; return; }
    if (q.length < 2) { ac.hidden = true; return; }
    const ql = q.toLowerCase();
    acItems = [];
    for (const c of CITIES) {
      const full = (c[0] + ', ' + c[1]).toLowerCase();
      if (c[0].toLowerCase().startsWith(ql) || full.startsWith(ql)) { acItems.push(c); if (acItems.length >= 8) break; }
    }
    if (!acItems.length) {
      for (const c of CITIES) { if (c[0].toLowerCase().includes(ql)) { acItems.push(c); if (acItems.length >= 8) break; } }
    }
    acIndex = -1;
    ac.innerHTML = acItems.map((c, i) => '<button type="button" data-i="' + i + '">' + esc(c[0]) + ' <span class="st">' + esc(c[1]) + '</span></button>').join('');
    ac.hidden = !acItems.length;
  });
  ac.addEventListener('mousedown', (e) => {
    const b = e.target.closest('button'); if (!b) return;
    e.preventDefault(); pickCity(acItems[Number(b.dataset.i)]);
  });
  cityInput.addEventListener('keydown', (e) => {
    if (ac.hidden) return;
    if (e.key === 'ArrowDown') { acIndex = Math.min(acItems.length - 1, acIndex + 1); }
    else if (e.key === 'ArrowUp') { acIndex = Math.max(0, acIndex - 1); }
    else if (e.key === 'Enter') { e.preventDefault(); pickCity(acItems[Math.max(0, acIndex)]); return; }
    else if (e.key === 'Escape') { ac.hidden = true; return; }
    else return;
    e.preventDefault();
    ac.querySelectorAll('button').forEach((b, i) => b.classList.toggle('active', i === acIndex));
  });
  cityInput.addEventListener('blur', () => setTimeout(() => { ac.hidden = true; }, 120));
  function pickCity(c) {
    if (!c) return;
    ac.hidden = true;
    setLocation(c[2], c[3], c[0] + ', ' + c[1]);
  }
  $('#f-name').addEventListener('input', updatePreviewPin);

  // photos
  $('#f-photos').addEventListener('change', (e) => {
    for (const f of e.target.files) pendingFiles.push({ file: f, url: URL.createObjectURL(f) });
    e.target.value = '';
    renderPhotoGrid();
  });
  function renderPhotoGrid() {
    const g = $('#photo-grid');
    g.innerHTML = photoIds.map((id, i) => '<div class="ph"><img src="' + esc(blobUrl(id)) + '" alt=""><button type="button" class="x" data-old="' + i + '" aria-label="remove photo">×</button></div>').join('') +
      pendingFiles.map((p, i) => '<div class="ph"><img src="' + esc(p.url) + '" alt=""><button type="button" class="x" data-new="' + i + '" aria-label="remove photo">×</button></div>').join('');
    g.querySelectorAll('.x').forEach((b) => b.addEventListener('click', () => {
      if (b.dataset.old != null) photoIds.splice(Number(b.dataset.old), 1);
      else pendingFiles.splice(Number(b.dataset.new), 1);
      renderPhotoGrid();
    }));
  }
  function shrink(file) {
    return new Promise((resolve) => {
      const img = new Image();
      const url = URL.createObjectURL(file);
      img.onload = () => {
        const max = 1600; let w = img.naturalWidth, h = img.naturalHeight;
        const s = Math.min(1, max / Math.max(w, h)); w = Math.round(w * s); h = Math.round(h * s);
        const c = document.createElement('canvas'); c.width = w; c.height = h;
        c.getContext('2d').drawImage(img, 0, 0, w, h);
        c.toBlob((b) => { URL.revokeObjectURL(url); resolve(b || file); }, 'image/jpeg', 0.85);
      };
      img.onerror = () => { URL.revokeObjectURL(url); resolve(file); };
      img.src = url;
    });
  }

  // form
  function resetForm() {
    editingId = null; photoIds = []; pendingFiles = [];
    ['f-id', 'f-lat', 'f-lng', 'f-name', 'f-city', 'f-ate', 'f-notes'].forEach((id) => { $('#' + id).value = ''; });
    $('#f-date').value = new Date().toISOString().slice(0, 10);
    setStars('mimi', 0);
    $('#form-title').textContent = 'new review';
    $('#cancel-edit').hidden = true;
    $('#loc-hint').textContent = 'pick a city, tap the map, or paste "lat, lng"';
    renderPhotoGrid(); updatePreviewPin();
    ssSet('shmee_draft', null);
  }
  function loadForm(r) {
    resetForm();
    editingId = r.id;
    $('#f-id').value = r.id; $('#f-name').value = r.name || ''; $('#f-city').value = r.place || '';
    $('#f-ate').value = r.ate || ''; $('#f-notes').value = r.notes || ''; $('#f-date').value = r.date || '';
    setStars('mimi', Number(r.ratingMimi) || 0);
    photoIds = Array.isArray(r.photos) ? r.photos.slice() : [];
    if (r.lat && r.lng) setLocation(Number(r.lat), Number(r.lng), null);
    $('#form-title').textContent = 'editing ' + (r.name || '');
    $('#cancel-edit').hidden = false;
    renderPhotoGrid();
    $('#review-form').scrollIntoView({ behavior: 'smooth', block: 'start' });
  }
  $('#cancel-edit').addEventListener('click', resetForm);

  function readForm() {
    const place = $('#f-city').value.trim();
    const stm = /,\s*([A-Z]{2})$/.exec(place);
    return {
      id: editingId || ('r' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6)),
      name: $('#f-name').value.trim(),
      place, state: stm ? stm[1] : '',
      lat: Number($('#f-lat').value), lng: Number($('#f-lng').value),
      ate: $('#f-ate').value.trim(),
      ratingMimi: Number($('#stars-mimi').dataset.value) || 0,
      notes: $('#f-notes').value.trim(),
      date: $('#f-date').value,
      photos: photoIds.slice(),
      by: admin,
    };
  }
  function setStatus(msg, err) { const s = $('#save-status'); s.textContent = msg; s.className = 'status' + (err ? ' err' : ''); }

  $('#review-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const r = readForm();
    if (!r.name) { setStatus('give it a name first.', true); return; }
    if (!(r.lat && r.lng)) { setStatus('where is it? pick a city or tap the map.', true); return; }
    const btn = $('#save-btn'); btn.disabled = true;
    try {
      if (pendingFiles.length) {
        if (!assetsNS) throw { code: 'no_assets' };
        for (let i = 0; i < pendingFiles.length; i++) {
          setStatus('uploading photo ' + (i + 1) + ' of ' + pendingFiles.length + '…');
          const blob = await shrink(pendingFiles[i].file);
          const up = await assetsNS.upload(blob, { type: blob.type || 'image/jpeg' });
          r.photos.push(up.id);
        }
      }
      const existing = DATA.reviews.find((x) => x.id === r.id);
      if (existing) Object.assign(existing, r, { created: existing.created || Date.now(), updated: Date.now() });
      else DATA.reviews.push(Object.assign(r, { created: Date.now() }));
      setStatus('saving…');
      await persist();
      ssSet('shmee_flash', existing ? 'updated ' + r.name : 'logged ' + r.name);
      ssSet('shmee_draft', null);
      // the view reloads to the new version; if it does not (no runtime), reflect locally
      resetForm(); renderAdminList(); setStatus('saved.');
    } catch (err) {
      const code = err && err.code;
      if (code === 'conflict') setStatus('someone else just saved. reloading to the newest version…', true);
      else if (code === 'not_writer' || code === 'not_granted') setStatus('this account can view but cannot save. ask lydia to add you as an editor of this page.', true);
      else if (code === 'no_assets') setStatus('photos need editor access on this page. remove them or ask lydia to add you as an editor.', true);
      else if (code === 'no_runtime') setStatus('saving only works on the published page.', true);
      else if (code === 'too_large') setStatus('that is too big to save. try fewer photos.', true);
      else setStatus('could not save (' + (code || (err && err.message) || 'unknown') + '). try again in a moment.', true);
    } finally { btn.disabled = false; }
  });

  async function persist() {
    if (artifactNS === undefined) await resolveCaps();
    if (!artifactNS) throw { code: 'no_runtime' };
    const src = await ownSource();
    const json = JSON.stringify({ reviews: DATA.reviews }).replace(/<\//g, '<\\/');
    const re = /(<script id="shmee-data" type="application\/json">)[\s\S]*?(<\/script>)/;
    if (!re.test(src)) throw { code: 'template' };
    let html = src.replace(re, (m, a, b) => a + json + b);
    if (!/^\s*<!doctype html>/i.test(html)) html = '<!doctype html>' + html;
    await artifactNS.publish(html);
  }
  async function ownSource() {
    const tries = ['index.html', location.pathname, location.href];
    for (const u of tries) {
      try {
        const res = await fetch(u, { cache: 'no-store' });
        if (!res.ok) continue;
        const t = await res.text();
        if (t.includes('id="shmee-data"')) return t;
      } catch (e) {}
    }
    throw { code: 'source' };
  }

  // admin list
  function renderAdminList() {
    const list = sortedReviews();
    const el = $('#admin-list');
    if (!list.length) { el.innerHTML = '<div class="empty-state">nothing yet. log the first one!</div>'; return; }
    el.innerHTML = list.map((r) => '<div class="admin-item" data-id="' + esc(r.id) + '">' +
      '<div><div class="n">' + esc(r.name) + '</div><div class="s">' + esc(r.place || '') + (r.date ? ' · ' + esc(fmtDate(r.date)) : '') + '</div></div>' +
      '<div class="acts"><button type="button" class="btn ghost small" data-edit>edit</button><button type="button" class="btn danger small" data-del>delete</button></div></div>').join('');
    el.querySelectorAll('[data-edit]').forEach((b) => b.addEventListener('click', () => {
      const r = DATA.reviews.find((x) => x.id === b.closest('.admin-item').dataset.id); if (r) loadForm(r);
    }));
    el.querySelectorAll('[data-del]').forEach((b) => b.addEventListener('click', () => {
      const item = b.closest('.admin-item'); const acts = item.querySelector('.acts');
      acts.innerHTML = '<span class="s">really delete?</span> <button type="button" class="btn danger small" data-yes>yes</button> <button type="button" class="btn ghost small" data-no>no</button>';
      acts.querySelector('[data-no]').addEventListener('click', renderAdminList);
      acts.querySelector('[data-yes]').addEventListener('click', async () => {
        const id = item.dataset.id;
        const idx = DATA.reviews.findIndex((x) => x.id === id);
        if (idx < 0) return;
        const removed = DATA.reviews.splice(idx, 1)[0];
        acts.innerHTML = '<span class="s">deleting…</span>';
        try {
          await persist();
          ssSet('shmee_flash', 'deleted ' + removed.name);
          renderAdminList();
        } catch (err) {
          DATA.reviews.splice(idx, 0, removed);
          renderAdminList();
          setStatus('could not delete (' + ((err && err.code) || 'unknown') + ').', true);
        }
      });
    }));
  }

  // draft stash so a reload (conflict, update) does not eat a half-written review
  ['f-name', 'f-city', 'f-ate', 'f-notes', 'f-date'].forEach((id) => {
    $('#' + id).addEventListener('input', () => {
      if (editingId) return;
      ssSet('shmee_draft', JSON.stringify({ name: $('#f-name').value, city: $('#f-city').value, ate: $('#f-ate').value, notes: $('#f-notes').value, date: $('#f-date').value, lat: $('#f-lat').value, lng: $('#f-lng').value, m: $('#stars-mimi').dataset.value }));
    });
  });
  (function restoreDraft() {
    try {
      const d = JSON.parse(ssGet('shmee_draft') || 'null'); if (!d) return;
      $('#f-name').value = d.name || ''; $('#f-city').value = d.city || ''; $('#f-ate').value = d.ate || ''; $('#f-notes').value = d.notes || '';
      if (d.date) $('#f-date').value = d.date;
      $('#f-lat').value = d.lat || ''; $('#f-lng').value = d.lng || '';
      setStars('mimi', Number(d.m) || 0);
    } catch (e) {}
  })();

  // ---------- boot ----------
  const flash = ssGet('shmee_flash');
  if (flash) { ssSet('shmee_flash', null); setTimeout(() => toast(flash), 300); }
  const start = (location.hash || '#home').slice(1);
  show(views.includes(start) ? start : 'home');
})();
</script>
